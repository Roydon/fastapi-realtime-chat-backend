apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-api
  namespace: chat-backend
  labels:
    app.kubernetes.io/name: chat-api
    app.kubernetes.io/part-of: fastapi-realtime-chat-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: chat-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: chat-api }
    spec:
      # No sticky sessions needed: any replica can serve any user, WebSockets included,
      # because delivery fans out through Redis (see README "How it works").
      automountServiceAccountToken: false
      # runAsUser must be numeric: the image's USER is the name "app" (uid 1001), and the
      # kubelet cannot verify runAsNonRoot against a non-numeric image user.
      securityContext: { runAsNonRoot: true, runAsUser: 1001, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        - name: migrate
          image: ghcr.io/OWNER/fastapi-realtime-chat-backend:latest
          command: ["sh", "-c", "alembic upgrade head && python -m app.bootstrap"]
          envFrom: [{ configMapRef: { name: chat-api-config } }, { secretRef: { name: chat-api-secrets } }]
      containers:
        - name: api
          image: ghcr.io/OWNER/fastapi-realtime-chat-backend:latest
          ports: [{ name: http, containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: chat-api-config } }, { secretRef: { name: chat-api-secrets } }]
          env:
            - name: REPLICA_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5, failureThreshold: 2 }
          # Let in-flight WebSocket connections drain instead of dropping mid-message.
          lifecycle: { preStop: { exec: { command: ["sleep", "5"] } } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: chat-api
  namespace: chat-backend
  labels: { app.kubernetes.io/name: chat-api }
spec:
  selector: { app.kubernetes.io/name: chat-api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chat-api
  namespace: chat-backend
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: chat-api } }
