worker_processes auto;
events { worker_connections 2048; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    log_format  main  '$remote_addr $request_id "$request" $status ${body_bytes_sent}B ${request_time}s';
    access_log  /var/log/nginx/access.log main;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Round-robins REST; /r1 and /r2 pin the demo panes to a specific replica
    # to prove cross-replica fan-out.
    upstream api      { server api1:8000; server api2:8000; }
    upstream api_r1   { server api1:8000; }
    upstream api_r2   { server api2:8000; }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    server {
        listen 8080;
        client_max_body_size 6m;

        location = / { return 302 /demo/; }

        location /demo/ {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /demo/index.html;
        }

        # Attachments: browsers reach MinIO through here, so presigned URLs are
        # signed for localhost:8080 (S3_PUBLIC_ENDPOINT_URL).
        location /chat-attachments/ {
            proxy_pass http://minio:9000;
            proxy_set_header Host $host;
        }

        location /v1/ws {
            proxy_pass http://api;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /r1/ { rewrite ^/r1/(.*)$ /$1 break; proxy_pass http://api_r1;
            proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s; }
        location /r2/ { rewrite ^/r2/(.*)$ /$1 break; proxy_pass http://api_r2;
            proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s; }

        location / { proxy_pass http://api; }
    }
}
