name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_VERSION: "0.10.6"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check app tools tests
      - run: uv run ruff format --check app tools tests
      - run: uv run mypy app tools

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fastapi-realtime-chat-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
