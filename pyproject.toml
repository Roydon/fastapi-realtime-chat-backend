[project]
name = "fastapi-realtime-chat-backend"
version = "0.1.0"
description = "Real-time 1:1 chat backend - FastAPI, WebSockets, PostgreSQL, Redis fan-out, delivery/read receipts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "boto3>=1.34",
    "fastapi>=0.115",
    "prometheus-client>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "pyjwt[crypto]>=2.8",
    "redis>=5.0",
    "regex>=2024.5.15",
    "sqlalchemy[asyncio]>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.34",
    "httpx>=0.27",
    "mypy>=1.10",
    "psycopg2-binary>=2.9",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "testcontainers[minio,postgres,redis]>=4.8",
    "types-regex>=2024.5.15",
    "websockets>=12.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF", "N"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "ASYNC109", "SIM117"]
"tools/**" = ["S105", "S106", "T201"]
"scripts/**" = ["S101", "S310", "ASYNC109", "ASYNC210", "T201"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tools"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:testcontainers.*", "ignore::DeprecationWarning:websockets.*"]

[tool.coverage.run]
source = ["app"]
branch = true
concurrency = ["thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
